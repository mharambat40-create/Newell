[workspace]
members = [
    "crates/newell-app",
    "crates/newell-render",
    "crates/newell-ui",
    "crates/newell-model",
    "crates/newell-kernel",
]
exclude = ["vendor/solidcore-0.0.1", "vendor/solidcore-1.0.1", "vendor/nurbs-grid-mesh-0.1.0", "vendor/faer-0.22.6"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
ab_glyph = "0.2.32"
thiserror = "2"
proptest = "1.12"
insta = "1.49"
# The geometric kernel is NEVER declared here. Only in crates/newell-kernel/Cargo.toml (M3.1), pinned =x.y.z.

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

# ADR0009: source resolution only; geometry dependencies stay kernel-local.
[patch.crates-io]
faer = { path = "vendor/faer-0.22.6" }

# Human-approved Rust1.88 compatibility corrections over immutable ADR0010 pin.
[patch."https://github.com/tangency-labs/solidcore"]
solidcore = { path = "vendor/solidcore-1.0.1" }
nurbs-grid-mesh = { path = "vendor/nurbs-grid-mesh-0.1.0" }
