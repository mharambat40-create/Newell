[package]
name = "newell-app"
version = "0.1.0"
description = "Binary entry point and window manager."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "newell_app"
path = "src/lib.rs"

[[bin]]
name = "newell"
path = "src/main.rs"

[dependencies]
newell-kernel = { path = "../newell-kernel", version = "0.1.0" }
newell-model = { path = "../newell-model", version = "0.1.0" }
newell-render = { path = "../newell-render", version = "0.1.0" }
newell-ui = { path = "../newell-ui", version = "0.1.0" }
thiserror.workspace = true
winit = "0.30.13"

[dev-dependencies]
newell-kernel = { path = "../newell-kernel", version = "0.1.0", features = ["test-support"] }
newell-model = { path = "../newell-model", version = "0.1.0", features = ["test-support"] }
proptest.workspace = true
insta.workspace = true
