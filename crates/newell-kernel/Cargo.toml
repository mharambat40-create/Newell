[package]
name = "newell-kernel"
version = "0.1.0"
description = "Anti-corruption layer over the BrepKIT kernel."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = []
m50-feasibility = ["brepkit-math/newell-m50", "brepkit-operations/newell-m50", "faer/newell-m50"]

[dependencies]
brepkit-math = "=4.2.2"
brepkit-operations = "=4.2.2"
brepkit-topology = "=4.2.2"
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
faer = { version = "=0.22.6", default-features = false, features = ["std", "sparse-linalg"] }
rstar = "=0.12.2"
ab_glyph = "=0.2.32"

[[bench]]
name = "sketch"
harness = false
