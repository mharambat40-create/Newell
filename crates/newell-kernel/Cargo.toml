[package]
name = "newell-kernel"
version = "0.1.0"
description = "SolidCore geometry boundary."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = []
rank-research = ["dep:faer", "faer/newell-m50"]

[dependencies]
nurbs-grid-mesh = { version = "=0.1.0", git = "https://github.com/tangency-labs/solidcore", rev = "85bf36811a32670e20c0e147c326129213d42cca" }
solidcore = { version = "=1.0.1", git = "https://github.com/tangency-labs/solidcore", rev = "85bf36811a32670e20c0e147c326129213d42cca" }
faer = { version = "=0.22.6", optional = true, default-features = false, features = ["std", "sparse-linalg"] }
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
insta.workspace = true
faer = { version = "=0.22.6", default-features = false, features = ["std", "sparse-linalg"] }
rstar = "=0.12.2"
ab_glyph = "=0.2.32"
