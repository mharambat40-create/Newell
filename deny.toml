[licenses]
allow = [
    "AGPL-3.0-or-later",
    "AGPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
private = { ignore = true }

[advisories]
unmaintained = "workspace"
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    { crate = "opencascade" },
    { crate = "opencascade-sys" },
    # BREPkit enters the dependency graph through this façade only. Its
    # constituent crates are necessarily transitive dependencies of operations.
    { crate = "brepkit-operations", wrappers = ["newell-kernel"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
